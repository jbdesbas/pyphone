esphome:
  name: playphone
  comment: Téléphone compteur d'histoire
  on_boot:
    priority: 600
    then:
      - delay: 2s
      - media_player.volume_set:
          id: phone_player
          volume: 0.15


esp32:
  board: esp32-s3-devkitc-1

psram:
  mode: octal
  speed: 80MHz



# Enable logging
logger:


# Enable Home Assistant API
api:
    encryption:
        key: !secret co2_esp_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  min_auth_mode: WPA2
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# =========================
# I2S
# =========================

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO11
    i2s_bclk_pin: GPIO10

# =========================
# MAX98357A
# =========================

speaker:
  - platform: i2s_audio
    id: phone_speaker
    dac_type: external
    i2s_dout_pin: GPIO12
    channel: mono

# =========================
# Media Player
# =========================

media_player:
  - platform: speaker
    name: "Phone Player"
    id: phone_player
    volume_min: 0.05
    volume_max: 0.3
    announcement_pipeline:
      speaker: phone_speaker



globals:
  - id: reading_intro
    type: bool
    initial_value: 'false'


binary_sensor:
  - platform: gpio
    id: rotary_active
    name: "rotary active"
    pin:
      number: GPIO4
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
    on_press: #début de la rotation
      then:
       - pulse_meter.set_total_pulses:
          id: mypulse_meter
          value: 0
    on_release: # fin de la rotation
      then:
      - logger.log:
          format: "Select %.0f"
          args: [ 'id(mytotal).state' ]
          level: INFO
      # lire un fichier sur le serveur
          
  - platform: gpio
    id: hangup
    name: "Hangup"
    pin:
      number: GPIO5
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
    on_release: # Raccroche
      then:
        - media_player.stop
        - lambda: |-
              id(reading_intro) = false;
    on_press: # Décroche
      then:
        - media_player.play_media:
            id: phone_player
            media_url: "http://playphone.desbas.fr/07/002_au_claire_de_la_lune.wav"

sensor:
  - platform: pulse_meter
    id: mypulse_meter
    name: "Pulse meter"
    internal_filter: 10ms
    timeout: 500ms
    total:
      name: "Total Pulses"
      id: mytotal
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true

